version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    # One PR a week. dist/ is built at release, so these pass CI; a changeset
    # ships them.
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 10
