name: CI

# Every PR and every push to main: build, test, and run the action from that
# build on Linux, macOS, and Windows. On main, once all of that passes, the
# release job ships the exact build the self-test ran (see the job).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR cancels its in-progress run. Runs on main are
# never cancelled: one might be releasing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One step for the whole toolchain: installs pnpm (version from the
      # "packageManager" field), Node (from "devEngines.runtime"), restores the
      # store cache, and runs the install with --frozen-lockfile.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      # Separate steps so a failing check is obvious in the GitHub UI.
      - run: pnpm build

      # dist/ is not committed on main (the Release workflow builds it onto
      # each release tag), so the self-test runs this build of it.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - run: pnpm test:coverage
      - run: pnpm typecheck
      - run: pnpm check

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true

  # Run the action itself, from this commit and the check job's build of
  # dist/, the way users run a release. The clean tree has a D2 block, so
  # every OS downloads, verifies, and extracts D2.
  self-test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Validate a clean tree
        id: clean
        uses: ./
        with:
          path: fixtures/clean

      - name: Validate a broken tree (report only)
        id: broken
        uses: ./
        with:
          path: fixtures/broken
          fail-on: never
          annotations: false

      - name: Check the outputs and the report
        shell: bash
        env:
          CLEAN_OK: ${{ steps.clean.outputs.ok }}
          BROKEN_OK: ${{ steps.broken.outputs.ok }}
          BROKEN_ERRORS: ${{ steps.broken.outputs.errors }}
          REPORT: ${{ steps.broken.outputs.report }}
        run: |
          test "$CLEAN_OK" = true
          test "$BROKEN_OK" = false
          test "$BROKEN_ERRORS" = 4
          node -e '
            const report = JSON.parse(require("fs").readFileSync(process.env.REPORT, "utf8"))
            const rules = report.findings.map((f) => f.ruleId)
            for (const rule of ["okforest/d2-syntax", "okforest/mermaid-syntax", "okf/type"]) {
              if (!rules.includes(rule)) throw new Error(`no ${rule} finding in ${process.env.REPORT}`)
            }
            console.log(`report ok: ${report.findings.length} findings`)
          '

  # Changesets flow: merging changeset files into main opens/updates a
  # "Version Packages" PR; merging THAT PR releases the version. main never
  # holds dist/ (it is gitignored). The release commits the dist/ artifact
  # that the check job built and the self-test ran on every OS (not a new
  # build) on top of main's commit, on no branch; tags it v1.2.3; moves the
  # major tag (v1) users pin to; and creates the GitHub Release from the
  # version's CHANGELOG.md section. Nothing is published to npm: an action
  # runs from this repository at a tag. The Action is listed on the GitHub
  # Marketplace, where each new release appears on its own (see
  # CONTRIBUTING.md).
  release:
    needs: [check, self-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Open or update the Version Packages PR
        id: changesets
        uses: changesets/action@v2

      # With no changesets left, main's version is released unless its tag
      # already exists (every push after a release, and Dependabot merges).
      - name: Check whether this version is released
        id: version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the tested dist/
        if: steps.version.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Tag the release, with dist/
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force dist
          git commit --quiet -m "v$VERSION: dist/ for the release"
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          MAJOR="v${VERSION%%.*}"
          git tag --force "$MAJOR"
          git push --force origin "refs/tags/$MAJOR"
          echo "v$VERSION and $MAJOR point to $(git rev-parse HEAD), on top of $GITHUB_SHA"

      - name: Create the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      # Release immutability is on (Settings → Releases): published releases
      # lock their tag. A warning, not a failure: the release is already out.
      - name: Check the release is immutable
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(gh release view "v$VERSION" --json isImmutable --jq .isImmutable)" != "true" ]; then
            echo "::warning::v$VERSION is not an immutable release. Is release immutability still on in Settings → Releases?"
          fi
